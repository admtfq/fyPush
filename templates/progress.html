<h2>Your Progress</h2>
<table>
    <tr>
        <th>Exercise</th>
        <th>Score</th>
        <th>Date</th>
    </tr>
    <tbody id="progress-table"></tbody>
</table>

<script>
function fetchProgress() {
    let userId = sessionStorage.getItem("user_id"); // Get user ID from session

    if (!userId) {
        console.error("User ID is missing! Ensure user is logged in.");
        return;
    }

    fetch(`/get-progress`)
    .then(response => response.json())
    .then(data => {
        let table = document.getElementById("progress-table");
        table.innerHTML = ""; // Clear previous data

        if (data.length === 0) {
            table.innerHTML = "<tr><td colspan='3'>No progress found</td></tr>";
        }

        data.forEach(item => {
            let row = `<tr>
                <td>${item.exercise}</td>
                <td>${item.score}</td>
                <td>${item.timestamp}</td>
            </tr>`;
            table.innerHTML += row;
        });
    })
    .catch(error => console.error("Error fetching progress:", error));
}

// Call fetchProgress when page loads
fetchProgress();

</script>
